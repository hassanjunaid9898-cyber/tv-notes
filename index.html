<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Note">
<meta name="theme-color" content="#07090c">
<title>TV Note</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090c; --panel: #12151c; --line: #262a33; --text: #ece7db; --muted: #9a9587; --accent: #d4b46a; --danger: #e07a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); display: flex; flex-direction: column; overscroll-behavior: none; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  h1 span { color: var(--accent); }
  .from { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .from input { width: 110px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 16px; }
  .pad-wrap { position: relative; flex: 1; min-height: 220px; max-height: 52vh; border-radius: 18px; border: 1px solid var(--line);
    background: radial-gradient(ellipse at 50% 40%, #141821 0%, #07090c 80%); overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #3e4250; font-size: 17px; pointer-events: none; text-align: center; padding: 20px; }
  .tools { display: flex; align-items: center; gap: 10px; padding: 12px 0; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .sw.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg) inset; }
  .tbtn { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; height: 34px; min-width: 40px; padding: 0 10px; font: inherit; font-size: 14px; }
  .tbtn.on { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  textarea { width: 100%; min-height: 64px; resize: none; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 14px; padding: 12px; font: inherit; font-size: 17px; }
  .actions { display: flex; gap: 10px; padding: 12px 0 14px; }
  .send { flex: 1; height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: #1a1408; font: inherit; font-size: 17px; font-weight: 600; }
  .send:disabled { opacity: 0.5; }
  .clear-tv { height: 50px; border-radius: 14px; background: transparent; border: 1px solid var(--line); color: var(--muted); font: inherit; font-size: 15px; padding: 0 14px; }
  .status { min-height: 20px; font-size: 14px; color: var(--muted); text-align: center; padding-bottom: 6px; }
  .status.ok { color: #9fd59f; } .status.err { color: var(--danger); }
  .nokey { margin: auto; text-align: center; color: var(--muted); line-height: 1.5; padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>Note to the <span>TV</span></h1>
  <label class="from">From <input id="from" maxlength="20" placeholder="Name" autocomplete="off"></label>
</header>

<div id="app" style="display:contents">
  <div class="pad-wrap">
    <canvas id="pad"></canvas>
    <div id="hint" class="hint">Write or draw with your finger</div>
  </div>
  <div class="tools" id="tools">
    <button class="sw on" data-c="#f2eee4" style="background:#f2eee4" aria-label="White"></button>
    <button class="sw" data-c="#e6c578" style="background:#e6c578" aria-label="Gold"></button>
    <button class="sw" data-c="#8cc7f0" style="background:#8cc7f0" aria-label="Blue"></button>
    <button class="sw" data-c="#f09aa8" style="background:#f09aa8" aria-label="Pink"></button>
    <button class="sw" data-c="#9ee0b0" style="background:#9ee0b0" aria-label="Green"></button>
    <span class="spacer"></span>
    <button class="tbtn" id="size" aria-label="Pen size">● M</button>
    <button class="tbtn" id="eraser">Eraser</button>
    <button class="tbtn" id="undo">Undo</button>
    <button class="tbtn" id="wipe">Clear</button>
  </div>
  <textarea id="text" maxlength="300" placeholder="…or type a message (optional)"></textarea>
  <div class="actions">
    <button class="clear-tv" id="clearTv">Clear TV</button>
    <button class="send" id="send">Send to TV</button>
  </div>
  <div id="status" class="status"></div>
</div>

<div id="nokey" class="nokey" style="display:none">
  This page needs your family link.<br>Open the link you were given (it ends with <b>#k=…</b>).
</div>

<script>
(function () {
  'use strict';
  // ---- Channel code: from the link's #k=… (never stored in this public page) ----
  var key = null;
  var m = /[#&]k=([A-Za-z0-9_-]{16,64})/.exec(location.hash);
  try {
    if (m) { key = m[1]; localStorage.setItem('tvnote-key', key); }
    else key = localStorage.getItem('tvnote-key');
  } catch (e) { if (m) key = m[1]; }
  if (!key) { document.getElementById('app').style.display = 'none'; document.getElementById('nokey').style.display = ''; return; }
  var RELAY = 'https://ntfy.sh/' + key;

  var $ = function (id) { return document.getElementById(id); };
  var fromEl = $('from');
  try { fromEl.value = localStorage.getItem('tvnote-from') || ''; } catch (e) {}
  fromEl.addEventListener('change', function () { try { localStorage.setItem('tvnote-from', fromEl.value.trim()); } catch (e) {} });

  // ---- Drawing pad (strokes kept as data so Undo / redraw are exact) ----
  var cv = $('pad'), ctx = cv.getContext('2d'), dpr = Math.max(1, window.devicePixelRatio || 1);
  var strokes = [], cur = null, color = '#f2eee4', sizes = [3, 6, 11], sizeNames = ['S', 'M', 'L'], sizeIdx = 1, erasing = false;

  function resize() {
    var r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    redraw();
  }
  function drawStroke(s) {
    var p = s.pts; if (!p.length) return;
    ctx.save();
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineWidth = s.w * dpr * (s.erase ? 3 : 1); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0] * dpr, p[0][1] * dpr, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); ctx.restore(); return; }
    ctx.beginPath(); ctx.moveTo(p[0][0] * dpr, p[0][1] * dpr);
    for (var i = 1; i < p.length - 1; i++) { // smooth with midpoints
      var mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
      ctx.quadraticCurveTo(p[i][0] * dpr, p[i][1] * dpr, mx * dpr, my * dpr);
    }
    var l = p[p.length - 1]; ctx.lineTo(l[0] * dpr, l[1] * dpr); ctx.stroke();
    ctx.restore();
  }
  function redraw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    strokes.forEach(drawStroke); if (cur) drawStroke(cur);
    $('hint').style.display = strokes.length || cur ? 'none' : '';
  }
  function pos(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = { color: color, w: sizes[sizeIdx], erase: erasing, pts: [pos(e)] }; redraw();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!cur) return; e.preventDefault();
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (var i = 0; i < list.length; i++) cur.pts.push(pos(list[i]));
    redraw();
  });
  function end() { if (cur) { strokes.push(cur); cur = null; redraw(); } }
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  window.addEventListener('resize', resize);
  resize();

  // ---- Tools ----
  Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (x) { x.classList.remove('on'); });
      b.classList.add('on'); color = b.getAttribute('data-c'); erasing = false; $('eraser').classList.remove('on');
    });
  });
  $('size').addEventListener('click', function () { sizeIdx = (sizeIdx + 1) % 3; $('size').textContent = '● ' + sizeNames[sizeIdx]; });
  $('eraser').addEventListener('click', function () { erasing = !erasing; $('eraser').classList.toggle('on', erasing); });
  $('undo').addEventListener('click', function () { strokes.pop(); redraw(); });
  $('wipe').addEventListener('click', function () { strokes = []; redraw(); });

  // ---- Export: crop to the drawing, scale to at most 1200 px wide, transparent PNG ----
  function exportDrawing() {
    if (!strokes.some(function (s) { return !s.erase; })) return null;
    var img = ctx.getImageData(0, 0, cv.width, cv.height).data, w = cv.width, h = cv.height;
    var x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y += 2) for (var x = 0; x < w; x += 2) {
      if (img[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return null;
    var pad = 12 * dpr; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
    var cw = x1 - x0, ch = y1 - y0, scale = Math.min(1, 1200 / cw, 600 / ch);
    var out = document.createElement('canvas'); out.width = Math.round(cw * scale); out.height = Math.round(ch * scale);
    out.getContext('2d').drawImage(cv, x0, y0, cw, ch, 0, 0, out.width, out.height);
    return new Promise(function (res) { out.toBlob(res, 'image/png'); });
  }

  // ---- Send ----
  function setStatus(msg, cls) { var s = $('status'); s.textContent = msg; s.className = 'status ' + (cls || ''); }
  function q(params) { return Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&'); }
  function send() {
    var text = $('text').value.trim(), from = fromEl.value.trim() || 'Family';
    try { localStorage.setItem('tvnote-from', fromEl.value.trim()); } catch (e) {}
    var drawing = exportDrawing();
    if (!drawing && !text) { setStatus('Write or draw something first', 'err'); return; }
    $('send').disabled = true; setStatus('Sending…');
    Promise.resolve(drawing).then(function (blob) {
      if (blob) {
        return fetch(RELAY + '?' + q({ title: from, message: text || '(drawing)', tags: 'tvnote,draw', filename: 'note.png' }),
          { method: 'PUT', body: blob });
      }
      return fetch(RELAY + '?' + q({ title: from, tags: 'tvnote,text' }), { method: 'POST', body: text });
    }).then(function (r) {
      if (!r.ok) throw new Error('relay ' + r.status);
      setStatus('Sent ✓ — it will appear on the TV within ~20 seconds', 'ok');
      strokes = []; redraw(); $('text').value = '';
    }).catch(function (e) {
      setStatus('Could not send (' + e.message + '). Check your internet and try again.', 'err');
    }).then(function () { $('send').disabled = false; });
  }
  $('send').addEventListener('click', send);
  $('clearTv').addEventListener('click', function () {
    if (!confirm('Remove the note from the TV?')) return;
    fetch(RELAY + '?' + q({ title: fromEl.value.trim() || 'Family', tags: 'tvnote,clear' }), { method: 'POST', body: 'clear' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); setStatus('TV note cleared ✓', 'ok'); })
      .catch(function () { setStatus('Could not clear — try again', 'err'); });
  });
})();
</script>
</body>
</html>
